name: pothigai_green
description: Pothigai Green - Waste Scanner and Recycling App
version: 1.6.1+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+9
  flutter_tts: 4.2.0
  google_mlkit_image_labeling: 0.13.0

  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4

  http: ^1.2.2
  image: 4.2.0
  tflite_flutter: 0.10.4

  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/ai/pothigai_waste_classifier_v3_fp16.tflite
    - assets/ai/pothigai_waste_classifier_v4_fp16.tflite
    - assets/ai/pothigai_waste_classifier_v5_fp16.tflite