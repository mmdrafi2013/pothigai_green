plugins { id 'com.android.application' }

android {
    namespace 'com.sooqflow.marketplace'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sooqflow.marketplace'
        minSdk 23
        targetSdk 35
        versionCode 25
        versionName '1.3.3'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
        pilot {
            initWith release
            applicationIdSuffix ".pilot"
            versionNameSuffix "-pilot"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

dependencies {}
