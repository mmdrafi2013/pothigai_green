name: Build Pothigai Green APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Android project files
        run: flutter create . --project-name pothigai_green --org com.pothigaigreen --platforms=android --overwrite

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Pothigai Green APK
        uses: actions/upload-artifact@v4
        with:
          name: Pothigai-APK
          path: build/app/outputs/flutter-apk/app-release.apk
