name: Build Pothigai Green Hybrid AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.22.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Backup Pothigai Green files
        run: |
          cp lib/main.dart /tmp/pothigai_main.dart
          cp pubspec.yaml /tmp/pothigai_pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/pothigai_manifest.xml
          cp android/app/google-services.json /tmp/google-services.json

      - name: Generate Flutter Android files
        run: flutter create . --project-name pothigai_green --org com.pothigaigreen --platforms=android --overwrite

      - name: Restore Pothigai Green files
        run: |
          cp /tmp/pothigai_main.dart lib/main.dart
          cp /tmp/pothigai_pubspec.yaml pubspec.yaml
          cp /tmp/pothigai_manifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/google-services.json android/app/google-services.json

      - name: Download V3 V4 V5 AI model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p assets/ai

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          wanted = {
              "pothigai-ai-broad-model-v3": "pothigai_waste_classifier_v3_fp16.tflite",
              "pothigai-ai-broad-model-v4": "pothigai_waste_classifier_v4_fp16.tflite",
              "pothigai-ai-broad-model-v5": "pothigai_waste_classifier_v5_fp16.tflite",
          }

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "PothigaiGreenHybridBuild/1.0",
          }

          list_url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100"
          req = urllib.request.Request(list_url, headers=headers)

          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          artifacts = payload.get("artifacts", [])
          destination = Path("assets/ai")
          destination.mkdir(parents=True, exist_ok=True)

          for artifact_name, output_name in wanted.items():
              matches = [
                  item
                  for item in artifacts
                  if item.get("name") == artifact_name
                  and not item.get("expired", False)
              ]

              if not matches:
                  raise SystemExit(f"Missing active artifact: {artifact_name}")

              matches.sort(
                  key=lambda item: item.get("created_at", ""),
                  reverse=True,
              )
              artifact = matches[0]
              artifact_id = artifact["id"]

              download_url = (
                  f"https://api.github.com/repos/{repo}"
                  f"/actions/artifacts/{artifact_id}/zip"
              )
              zip_path = Path(f"/tmp/{artifact_name}.zip")

              req = urllib.request.Request(download_url, headers=headers)

              with urllib.request.urlopen(req) as response:
                  zip_path.write_bytes(response.read())

              with zipfile.ZipFile(zip_path) as archive:
                  candidates = [
                      member
                      for member in archive.namelist()
                      if member.endswith(output_name)
                  ]

                  if len(candidates) != 1:
                      raise SystemExit(
                          f"Could not uniquely find {output_name} "
                          f"in {artifact_name}: {candidates}"
                      )

                  data = archive.read(candidates[0])
                  (destination / output_name).write_bytes(data)

              print(
                  artifact_name,
                  "->",
                  destination / output_name,
                  "bytes=",
                  (destination / output_name).stat().st_size,
              )
          PY

          test -s assets/ai/pothigai_waste_classifier_v3_fp16.tflite
          test -s assets/ai/pothigai_waste_classifier_v4_fp16.tflite
          test -s assets/ai/pothigai_waste_classifier_v5_fp16.tflite

      - name: Remove Flutter sample files
        run: |
          rm -rf test
          rm -f analysis_options.yaml

      - name: Configure Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "com.pothigaigreen.pothigai_green",
              "com.pothigaigreen"
          )

          text = re.sub(
              r'(?m)^(\s*)minSdkVersion\s+.*$',
              r'\1minSdkVersion 23',
              text
          )
          text = re.sub(
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'\1compileSdkVersion 34',
              text
          )
          text = re.sub(
              r'(?m)^(\s*)targetSdkVersion\s+.*$',
              r'\1targetSdkVersion 34',
              text
          )
          text = re.sub(
              r'(?m)^(\s*)minSdk\s*=\s*.*$',
              r'\1minSdk = 23',
              text
          )
          text = re.sub(
              r'(?m)^(\s*)compileSdk\s*=\s*.*$',
              r'\1compileSdk = 34',
              text
          )
          text = re.sub(
              r'(?m)^(\s*)targetSdk\s*=\s*.*$',
              r'\1targetSdk = 34',
              text
          )

          path.write_text(text)
          PY

      - name: Fix MainActivity package
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)

          if [ -n "$MAIN_ACTIVITY" ]; then
            sed -i 's/package com.pothigaigreen.pothigai_green/package com.pothigaigreen/' "$MAIN_ACTIVITY"
          fi

      - name: Configure Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          settings_text = settings.read_text()

          if 'com.google.gms.google-services' not in settings_text:
              settings_text = settings_text.replace(
                  'plugins {',
                  '''plugins {
              id "com.google.gms.google-services" version "4.4.2" apply false''',
                  1
              )

          settings.write_text(settings_text)

          app = Path("android/app/build.gradle")
          app_text = app.read_text()

          if 'id "com.google.gms.google-services"' not in app_text:
              app_text = app_text.replace(
                  'plugins {',
                  '''plugins {
              id "com.google.gms.google-services"''',
                  1
              )

          app.write_text(app_text)
          PY

      - name: Set Kotlin 1.9.22
        run: |
          if grep -q "org.jetbrains.kotlin.android" android/settings.gradle; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          fi

          if grep -q "ext.kotlin_version" android/build.gradle; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle
          else
            sed -i "1i ext.kotlin_version = '1.9.22'" android/build.gradle
          fi

      - name: Verify hybrid integration
        run: |
          test -s assets/ai/pothigai_waste_classifier_v3_fp16.tflite
          test -s assets/ai/pothigai_waste_classifier_v4_fp16.tflite
          test -s assets/ai/pothigai_waste_classifier_v5_fp16.tflite
          grep -q "hybrid-v3-v4-v5-consensus" lib/main.dart
          grep -q "tflite_flutter" pubspec.yaml
          echo "Hybrid V3/V4/V5 integration confirmed."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean Flutter build
        run: flutter clean

      - name: Get Flutter dependencies again
        run: flutter pub get

      - name: Build Pothigai Green Hybrid APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload hybrid APK
        uses: actions/upload-artifact@v4
        with:
          name: Pothigai-Hybrid-V3-V4-V5-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30