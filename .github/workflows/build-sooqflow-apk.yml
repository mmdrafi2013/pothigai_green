name: Build SooqFlow Android
on:
  push:
    branches: [ sooqflow-apk-build ]
    paths:
      - 'sooqflow-apk/**'
      - '.github/workflows/build-sooqflow-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build installable pilot APK
        working-directory: sooqflow-apk
        run: gradle --no-daemon assemblePilot
      - name: Rename APK
        run: cp sooqflow-apk/app/build/outputs/apk/pilot/app-pilot.apk SooqFlow-v1.3.1-pilot.apk
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"; fi
          "$APKSIGNER" verify --verbose --print-certs SooqFlow-v1.3.1-pilot.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SooqFlow-Pilot-APK
          path: SooqFlow-v1.3.1-pilot.apk
          if-no-files-found: error
