name: Build SooqFlow Android
on:
  push:
    branches: [ sooqflow-apk-build ]
    paths:
      - 'sooqflow-apk/**'
      - '.github/workflows/build-sooqflow-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Build APKs and bundle
        working-directory: sooqflow-apk
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Collect artifacts
        run: |
          cp sooqflow-apk/app/build/outputs/apk/debug/app-debug.apk SooqFlow-v1.1.0-testing.apk
          cp sooqflow-apk/app/build/outputs/apk/release/app-release-unsigned.apk SooqFlow-v1.1.0-release-unsigned.apk
          cp sooqflow-apk/app/build/outputs/bundle/release/app-release.aab SooqFlow-v1.1.0-unsigned.aab
      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: SooqFlow-Production-Candidate
          path: |
            SooqFlow-v1.1.0-testing.apk
            SooqFlow-v1.1.0-release-unsigned.apk
            SooqFlow-v1.1.0-unsigned.aab
          if-no-files-found: error
