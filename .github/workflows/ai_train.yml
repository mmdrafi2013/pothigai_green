name: Train Pothigai AI Scanner V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow-cpu==2.17.1" "numpy==1.26.4" "pillow==10.4.0" "scikit-learn==1.5.2" "requests==2.32.3"

      - name: Download TACO safely
        run: |
          git clone --depth 1 https://github.com/pedropro/TACO.git taco

          python - <<'PY'
          import json,time
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image,ImageOps

          root=Path("taco").resolve()
          data=json.loads((root/"data"/"annotations.json").read_text())
          s=requests.Session()
          s.headers.update({"User-Agent":"PothigaiGreenV5/1.0"})
          good=0; bad=0

          for i,item in enumerate(data["images"],1):
              dest=root/"data"/item["file_name"]

              if dest.exists() and dest.stat().st_size>0:
                  good+=1
                  continue

              dest.parent.mkdir(parents=True,exist_ok=True)
              saved=False
              last=None

              for url in [item.get("flickr_url"),item.get("flickr_640_url")]:
                  if not url:
                      continue

                  for attempt in range(1,4):
                      try:
                          r=s.get(url,timeout=30)
                          r.raise_for_status()

                          if len(r.content)<128:
                              raise ValueError("response too small")

                          with Image.open(BytesIO(r.content)) as im:
                              im=ImageOps.exif_transpose(im).convert("RGB")
                              im.load()
                              im.save(dest,"JPEG",quality=95)

                          saved=True
                          good+=1
                          break

                      except Exception as exc:
                          last=exc
                          time.sleep(attempt*1.5)

                  if saved:
                      break

              if not saved:
                  bad+=1
                  print("WARNING",item["file_name"],last)

              if i%100==0:
                  print("TACO",i,"good",good,"skipped",bad)

          if good<500:
              raise SystemExit("Too few TACO images")

          print("TACO complete",good,bad)
          PY

      - name: Download TrashNet
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests,zipfile

          url="https://raw.githubusercontent.com/garythung/trashnet/master/data/dataset-resized.zip"

          r=requests.get(
              url,
              timeout=120,
              headers={"User-Agent":"PothigaiGreenV5/1.0"}
          )
          r.raise_for_status()

          if len(r.content)<10000000:
              raise SystemExit("TrashNet ZIP too small")

          root=Path("trashnet")
          root.mkdir(exist_ok=True)

          with zipfile.ZipFile(BytesIO(r.content)) as z:
              z.extractall(root)

          for c in ["cardboard","glass","metal","paper","plastic"]:
              folder=root/"dataset-resized"/c
              n=sum(
                  1 for p in folder.iterdir()
                  if p.is_file()
                  and p.suffix.lower() in {".jpg",".jpeg",".png"}
              )
              print(c,n)

              if n<300:
                  raise SystemExit(f"Low TrashNet count {c}: {n}")
          PY

      - name: Build V5 dataset
        run: |
          python - <<'PY'
          import json,hashlib,math
          from pathlib import Path
          from collections import defaultdict
          from PIL import Image,ImageOps

          OUT=Path("training_data").resolve()
          TACO=Path("taco").resolve()
          TRASH=Path("trashnet/dataset-resized").resolve()

          CLASSES=["cardboard","glass","metal","paper","plastic"]

          MAP={
              "plastic":{
                  "clear plastic bottle","other plastic bottle",
                  "disposable plastic cup","other plastic cup",
                  "other plastic container","tupperware","spread tub",
                  "squeezable tube","plastic lid","plastic film",
                  "single-use carrier bag","garbage bag",
                  "other plastic wrapper","crisp packet",
                  "polypropylene bag","six pack rings"
              },
              "paper":{
                  "normal paper","magazine paper","wrapping paper",
                  "paper bag","paper cup","paper straw","tissues"
              },
              "cardboard":{
                  "corrugated carton","drink carton","meal carton",
                  "other carton","pizza box","toilet tube","egg carton"
              },
              "metal":{
                  "drink can","food can","aerosol","aluminium foil",
                  "metal lid","metal bottle cap","scrap metal","pop tab"
              },
              "glass":{
                  "glass bottle","glass cup","glass jar","broken glass"
              }
          }

          def norm(v):
              return " ".join(str(v).strip().lower().replace("_"," ").split())

          reverse={
              norm(src):target
              for target,names in MAP.items()
              for src in names
          }

          def split(key):
              d=hashlib.sha256(f"pothigai-v5:{key}".encode()).digest()
              x=int.from_bytes(d[:8],"big")/2**64
              return "train" if x<.80 else ("val" if x<.90 else "test")

          def crop(im,bbox):
              if not bbox or len(bbox)!=4:
                  return None

              x,y,w,h=[float(v) for v in bbox]

              if w<28 or h<28:
                  return None

              # More context helps transparent glass and thin plastics.
              px=w*.30
              py=h*.30

              l=max(0,math.floor(x-px))
              t=max(0,math.floor(y-py))
              r=min(im.width,math.ceil(x+w+px))
              b=min(im.height,math.ceil(y+h+py))

              if r<=l or b<=t:
                  return None

              return im.crop((l,t,r,b)).convert("RGB")

          taco=json.loads((TACO/"data"/"annotations.json").read_text())
          images={int(x["id"]):x for x in taco["images"]}
          cats={int(x["id"]):norm(x["name"]) for x in taco["categories"]}

          grouped=defaultdict(list)
          for a in taco["annotations"]:
              grouped[int(a["image_id"])].append(a)

          for image_id,anns in grouped.items():
              meta=images.get(image_id)

              if not meta:
                  continue

              src=TACO/"data"/meta["file_name"]

              if not src.exists():
                  continue

              try:
                  with Image.open(src) as im:
                      im=ImageOps.exif_transpose(im).convert("RGB")

                      for idx,a in enumerate(anns):
                          target=reverse.get(cats.get(int(a["category_id"]),""))

                          if target not in CLASSES:
                              continue

                          c=crop(im,a.get("bbox"))

                          if c is None:
                              continue

                          s=split(f"taco:{image_id}")
                          d=OUT/s/target
                          d.mkdir(parents=True,exist_ok=True)

                          c.save(
                              d/f"taco_{image_id}_{idx}.jpg",
                              "JPEG",
                              quality=94
                          )

              except Exception as exc:
                  print("WARNING TACO",src,exc)

          for target in CLASSES:
              for src in sorted((TRASH/target).iterdir()):
                  if (
                      not src.is_file()
                      or src.suffix.lower() not in {".jpg",".jpeg",".png"}
                  ):
                      continue

                  s=split(f"trashnet:{target}:{src.name}")
                  d=OUT/s/target
                  d.mkdir(parents=True,exist_ok=True)

                  try:
                      with Image.open(src) as im:
                          im=ImageOps.exif_transpose(im).convert("RGB")
                          im.save(
                              d/f"trashnet_{src.stem}.jpg",
                              "JPEG",
                              quality=94
                          )
                  except Exception as exc:
                      print("WARNING TrashNet",src,exc)

          totals={}

          for s in ["train","val","test"]:
              totals[s]={}

              for c in CLASSES:
                  folder=OUT/s/c
                  n=0 if not folder.exists() else sum(
                      1 for p in folder.iterdir()
                      if p.is_file()
                  )

                  totals[s][c]=n
                  minimum=250 if s=="train" else 25

                  if n<minimum:
                      raise SystemExit(f"Insufficient {s}/{c}: {n}")

          print(json.dumps(totals,indent=2))

          (OUT/"dataset_manifest.json").write_text(
              json.dumps({
                  "version":"v5",
                  "classes":CLASSES,
                  "counts":totals,
                  "sources":{
                      "TACO":"https://github.com/pedropro/TACO",
                      "TrashNet":"https://github.com/garythung/trashnet"
                  },
                  "focus":[
                      "glass-vs-plastic separation",
                      "paper-vs-plastic separation",
                      "more contextual TACO crops",
                      "class-aware hard-example sampling"
                  ],
                  "warning":"Broad material recognition only; resin chemistry is separate."
              },indent=2)
          )
          PY

      - name: Train V5 broad model
        run: |
          python - <<'PY'
          import json,random
          from pathlib import Path
          import numpy as np
          import tensorflow as tf
          from sklearn.metrics import classification_report,confusion_matrix

          ROOT=Path("training_data")
          OUT=Path("pothigai_ai_model_v5")
          OUT.mkdir(exist_ok=True)

          CLASSES=["cardboard","glass","metal","paper","plastic"]
          IMG=256
          BATCH=24
          SEED=42

          random.seed(SEED)
          np.random.seed(SEED)
          tf.random.set_seed(SEED)

          def class_stream(class_name):
              ds=tf.keras.utils.image_dataset_from_directory(
                  ROOT/"train",
                  labels="inferred",
                  label_mode="int",
                  class_names=CLASSES,
                  image_size=(IMG,IMG),
                  batch_size=None,
                  shuffle=True,
                  seed=SEED
              )

              idx=CLASSES.index(class_name)

              return ds.filter(
                  lambda image,label:
                  tf.equal(
                      label,
                      tf.cast(idx,label.dtype)
                  )
              ).repeat()

          streams=[
              class_stream(c)
              for c in CLASSES
          ]

          # Emphasize glass and plastic, while keeping paper adequately sampled.
          weights=[
              0.15,  # cardboard
              0.27,  # glass
              0.15,  # metal
              0.18,  # paper
              0.25,  # plastic
          ]

          train=tf.data.Dataset.sample_from_datasets(
              streams,
              weights=weights,
              seed=SEED
          ).batch(BATCH).prefetch(tf.data.AUTOTUNE)

          def eval_ds(split):
              return tf.keras.utils.image_dataset_from_directory(
                  ROOT/split,
                  labels="inferred",
                  label_mode="int",
                  class_names=CLASSES,
                  image_size=(IMG,IMG),
                  batch_size=BATCH,
                  shuffle=False
              ).prefetch(tf.data.AUTOTUNE)

          val=eval_ds("val")
          test=eval_ds("test")

          counts={
              c:sum(
                  1 for p in (ROOT/"train"/c).iterdir()
                  if p.is_file()
              )
              for c in CLASSES
          }

          steps=max(
              60,
              int(max(counts.values())*len(CLASSES)/BATCH)
          )

          print("Train counts",counts)
          print("Steps",steps)

          aug=tf.keras.Sequential([
              tf.keras.layers.RandomFlip("horizontal"),
              tf.keras.layers.RandomRotation(.10),
              tf.keras.layers.RandomZoom(
                  height_factor=(-.08,.14),
                  width_factor=(-.08,.14)
              ),
              tf.keras.layers.RandomTranslation(.08,.08),
              tf.keras.layers.RandomContrast(.22),
              tf.keras.layers.RandomBrightness(
                  factor=.14,
                  value_range=(0.0,255.0)
              )
          ])

          base=tf.keras.applications.MobileNetV3Large(
              input_shape=(IMG,IMG,3),
              include_top=False,
              weights="imagenet",
              include_preprocessing=True
          )

          base.trainable=False

          inp=tf.keras.Input((IMG,IMG,3),name="image")
          x=aug(inp)
          x=base(x,training=False)
          x=tf.keras.layers.GlobalAveragePooling2D()(x)
          x=tf.keras.layers.BatchNormalization()(x)
          x=tf.keras.layers.Dropout(.32)(x)

          out=tf.keras.layers.Dense(
              len(CLASSES),
              activation="softmax",
              name="probabilities"
          )(x)

          model=tf.keras.Model(inp,out)
          ckpt=OUT/"best.keras"

          callbacks=[
              tf.keras.callbacks.EarlyStopping(
                  monitor="val_loss",
                  patience=5,
                  restore_best_weights=True
              ),
              tf.keras.callbacks.ReduceLROnPlateau(
                  monitor="val_loss",
                  factor=.25,
                  patience=2,
                  min_lr=5e-7
              ),
              tf.keras.callbacks.ModelCheckpoint(
                  ckpt,
                  monitor="val_loss",
                  save_best_only=True
              )
          ]

          model.compile(
              optimizer=tf.keras.optimizers.Adam(6e-4),
              loss="sparse_categorical_crossentropy",
              metrics=["accuracy"]
          )

          model.fit(
              train,
              validation_data=val,
              epochs=20,
              steps_per_epoch=steps,
              callbacks=callbacks,
              verbose=2
          )

          base.trainable=True

          for layer in base.layers[:-70]:
              layer.trainable=False

          model.compile(
              optimizer=tf.keras.optimizers.Adam(7e-6),
              loss="sparse_categorical_crossentropy",
              metrics=["accuracy"]
          )

          model.fit(
              train,
              validation_data=val,
              epochs=10,
              steps_per_epoch=steps,
              callbacks=callbacks,
              verbose=2
          )

          model=tf.keras.models.load_model(ckpt)

          yt=[]
          yp=[]
          conf=[]

          for xb,yb in test:
              p=model.predict(xb,verbose=0)
              yt+=yb.numpy().tolist()
              yp+=np.argmax(p,axis=1).tolist()
              conf+=np.max(p,axis=1).tolist()

          report=classification_report(
              yt,
              yp,
              labels=list(range(len(CLASSES))),
              target_names=CLASSES,
              output_dict=True,
              zero_division=0
          )

          cm=confusion_matrix(
              yt,
              yp,
              labels=list(range(len(CLASSES)))
          ).tolist()

          accuracy=float(report["accuracy"])
          macro=float(report["macro avg"]["f1-score"])
          weighted=float(report["weighted avg"]["f1-score"])

          recalls={
              c:float(report[c]["recall"])
              for c in CLASSES
          }

          precision={
              c:float(report[c]["precision"])
              for c in CLASSES
          }

          f1={
              c:float(report[c]["f1-score"])
              for c in CLASSES
          }

          minrec=min(recalls.values())

          (OUT/"labels.txt").write_text(
              "\n".join(CLASSES)+"\n"
          )

          converter=tf.lite.TFLiteConverter.from_keras_model(model)
          converter.optimizations=[tf.lite.Optimize.DEFAULT]
          converter.target_spec.supported_types=[tf.float16]

          lite=converter.convert()

          lite_path=OUT/"pothigai_waste_classifier_v5_fp16.tflite"
          lite_path.write_bytes(lite)

          interpreter=tf.lite.Interpreter(
              model_path=str(lite_path)
          )
          interpreter.allocate_tensors()

          ind=interpreter.get_input_details()[0]
          outd=interpreter.get_output_details()[0]

          agreement=[]
          checked=0

          for xb,_ in test:
              keras_p=model.predict(xb,verbose=0)

              for i in range(int(xb.shape[0])):
                  if checked>=150:
                      break

                  sample=xb[i:i+1].numpy().astype(ind["dtype"])

                  interpreter.set_tensor(
                      ind["index"],
                      sample
                  )

                  interpreter.invoke()

                  lite_p=interpreter.get_tensor(
                      outd["index"]
                  )[0]

                  agreement.append(
                      int(np.argmax(keras_p[i]))
                      ==
                      int(np.argmax(lite_p))
                  )

                  checked+=1

              if checked>=150:
                  break

          tflite_agreement=float(np.mean(agreement)) if agreement else 0.0

          ready=(
              macro>=.85
              and minrec>=.75
              and tflite_agreement>=.98
          )

          manifest={
              "model":"Pothigai Green Broad Waste Classifier V5",
              "architecture":"MobileNetV3Large",
              "input_size":[IMG,IMG,3],
              "classes":CLASSES,
              "test_accuracy":accuracy,
              "test_macro_f1":macro,
              "test_weighted_f1":weighted,
              "per_class_recall":recalls,
              "per_class_precision":precision,
              "per_class_f1":f1,
              "minimum_class_recall":minrec,
              "mean_top1_confidence":float(np.mean(conf)) if conf else 0.0,
              "tflite_top1_agreement":tflite_agreement,
              "confusion_matrix":cm,
              "deployment_ready":bool(ready),
              "quality_gate":{
                  "macro_f1":.85,
                  "minimum_class_recall":.75,
                  "tflite_top1_agreement":.98
              },
              "mobile_policy":{
                  "confidence_0_90_plus":"auto_suggest",
                  "confidence_0_75_to_0_90":"ask_customer_confirmation",
                  "confidence_below_0_75":"existing_scanner_or_manual_fallback"
              },
              "warning":"Broad model only. PET/HDPE/LDPE/PP require resin-code or separately validated resin classification."
          }

          (OUT/"model_manifest.json").write_text(
              json.dumps(manifest,indent=2)
          )

          (OUT/"classification_report.json").write_text(
              json.dumps(report,indent=2)
          )

          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload V5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pothigai-ai-broad-model-v5
          path: |
            pothigai_ai_model_v5/pothigai_waste_classifier_v5_fp16.tflite
            pothigai_ai_model_v5/labels.txt
            pothigai_ai_model_v5/model_manifest.json
            pothigai_ai_model_v5/classification_report.json
            training_data/dataset_manifest.json
          if-no-files-found: error
          retention-days: 30