              ),
          }

          (
              OUT
              / "model_manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (
              OUT
              / "classification_report.json"
          ).write_text(
              json.dumps(
                  report,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(
              json.dumps(
                  manifest,
                  indent=2,
              )
