name: Train Pothigai AI Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Pothigai Green
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow-cpu==2.17.1" "numpy==1.26.4" "pillow==10.4.0" "scikit-learn==1.5.2" "requests==2.32.3"

      - name: Download official TACO dataset
        run: |
          git clone --depth 1 https://github.com/pedropro/TACO.git taco
          cd taco
          python download.py

      - name: Prepare broad waste dataset
        run: |
          python - <<'PY'
          import json, hashlib, math
          from pathlib import Path
          from collections import Counter, defaultdict
          from PIL import Image, ImageOps

          ROOT = Path("taco").resolve()
          OUT = Path("training_data").resolve()
          ANN = ROOT / "data" / "annotations.json"

          CLASS_MAP = {
              "plastic_bottle": {"clear plastic bottle", "other plastic bottle"},
              "plastic_container": {"disposable plastic cup", "other plastic cup", "other plastic container", "tupperware", "spread tub", "squeezable tube", "plastic lid"},
              "plastic_film": {"plastic film", "single-use carrier bag", "garbage bag", "other plastic wrapper", "crisp packet", "polypropylene bag", "six pack rings"},
              "paper": {"normal paper", "magazine paper", "wrapping paper", "paper bag", "paper cup", "paper straw", "tissues"},
              "cardboard": {"corrugated carton", "drink carton", "meal carton", "other carton", "pizza box", "toilet tube", "egg carton"},
              "metal": {"drink can", "food can", "aerosol", "aluminium foil", "metal lid", "metal bottle cap", "scrap metal", "pop tab"},
              "glass": {"glass bottle", "glass cup", "glass jar", "broken glass"},
          }

          def norm(s):
              return " ".join(str(s).strip().lower().replace("_", " ").split())

          reverse = {norm(src): target for target, names in CLASS_MAP.items() for src in names}

          def split_for(image_id):
              d = hashlib.sha256(f"42:{image_id}".encode()).digest()
              x = int.from_bytes(d[:8], "big") / 2**64
              return "train" if x < .80 else ("val" if x < .90 else "test")

          def crop(img, bbox):
              if not bbox or len(bbox) != 4: return None
              x, y, w, h = [float(v) for v in bbox]
              if w < 28 or h < 28: return None
              px, py = w*.10, h*.10
              l=max(0,math.floor(x-px)); t=max(0,math.floor(y-py))
              r=min(img.width,math.ceil(x+w+px)); b=min(img.height,math.ceil(y+h+py))
              if r<=l or b<=t: return None
              return img.crop((l,t,r,b)).convert("RGB")

          data=json.loads(ANN.read_text(encoding="utf-8"))
          images={int(x["id"]):x for x in data["images"]}
          cats={int(x["id"]):norm(x["name"]) for x in data["categories"]}
          by=defaultdict(list)
          for a in data["annotations"]: by[int(a["image_id"])].append(a)
          counts=Counter()

          for image_id, anns in by.items():
              meta=images.get(image_id)
              if not meta: continue
              p=ROOT/"data"/meta["file_name"]
              if not p.exists(): continue
              try:
                  with Image.open(p) as im:
                      img=ImageOps.exif_transpose(im).convert("RGB")
                      for i,a in enumerate(anns):
                          target=reverse.get(cats.get(int(a["category_id"]),""))
                          if not target: continue
                          c=crop(img,a.get("bbox"))
                          if c is None: continue
                          split=split_for(image_id)
                          d=OUT/split/target; d.mkdir(parents=True,exist_ok=True)
                          c.save(d/f"taco_{image_id}_{i}.jpg","JPEG",quality=92)
                          counts[(split,target)]+=1
              except Exception as e:
                  print("WARNING",p,e)

          print(dict(counts))
          if len({c for (s,c),n in counts.items() if s=="train" and n>=20}) < 3:
              raise SystemExit("Too few mapped classes/images")
          OUT.mkdir(exist_ok=True)
          (OUT/"dataset_manifest.json").write_text(json.dumps({"source":"TACO","counts":{f"{s}/{c}":n for (s,c),n in counts.items()}},indent=2))
          PY

      - name: Train and validate MobileNetV3 model
        run: |
          python - <<'PY'
          import json, os, random
          from pathlib import Path
          import numpy as np
          import tensorflow as tf
          from sklearn.metrics import classification_report
          from sklearn.utils.class_weight import compute_class_weight

          ROOT=Path("training_data"); OUT=Path("pothigai_ai_model"); OUT.mkdir(exist_ok=True)
          IMG=224; BATCH=32; SEED=42
          random.seed(SEED); np.random.seed(SEED); tf.random.set_seed(SEED)

          exts={".jpg",".jpeg",".png",".webp"}
          classes=sorted(p.name for p in (ROOT/"train").iterdir() if p.is_dir() and sum(1 for s in ("train","val","test") for q in (ROOT/s/p.name).rglob("*") if q.is_file() and q.suffix.lower() in exts)>=50)
          if len(classes)<3: raise SystemExit("Need at least 3 populated classes")

          def ds(split,shuffle):
              return tf.keras.utils.image_dataset_from_directory(ROOT/split,labels="inferred",label_mode="int",class_names=classes,image_size=(IMG,IMG),batch_size=BATCH,shuffle=shuffle,seed=SEED if shuffle else None).prefetch(tf.data.AUTOTUNE)

          train=ds("train",True); val=ds("val",False); test=ds("test",False)
          y=np.concatenate([b.numpy() for _,b in train])
          w=compute_class_weight(class_weight="balanced",classes=np.arange(len(classes)),y=y)
          cw={i:float(v) for i,v in enumerate(w)}

          aug=tf.keras.Sequential([tf.keras.layers.RandomFlip("horizontal"),tf.keras.layers.RandomRotation(.08),tf.keras.layers.RandomZoom(.12),tf.keras.layers.RandomContrast(.15)])
          base=tf.keras.applications.MobileNetV3Small(input_shape=(IMG,IMG,3),include_top=False,weights="imagenet",include_preprocessing=True)
          base.trainable=False
          inp=tf.keras.Input((IMG,IMG,3)); x=aug(inp); x=base(x,training=False); x=tf.keras.layers.GlobalAveragePooling2D()(x); x=tf.keras.layers.Dropout(.25)(x); out=tf.keras.layers.Dense(len(classes),activation="softmax")(x)
          model=tf.keras.Model(inp,out)
          cb=[tf.keras.callbacks.EarlyStopping(monitor="val_loss",patience=3,restore_best_weights=True),tf.keras.callbacks.ModelCheckpoint(OUT/"best.keras",monitor="val_loss",save_best_only=True)]
          model.compile(optimizer=tf.keras.optimizers.Adam(1e-3),loss="sparse_categorical_crossentropy",metrics=["accuracy"])
          model.fit(train,validation_data=val,epochs=12,class_weight=cw,callbacks=cb,verbose=2)
          model=tf.keras.models.load_model(OUT/"best.keras")

          yt=[]; yp=[]
          for xb,yb in test:
              p=model.predict(xb,verbose=0); yt += yb.numpy().tolist(); yp += np.argmax(p,axis=1).tolist()
          report=classification_report(yt,yp,labels=list(range(len(classes))),target_names=classes,output_dict=True,zero_division=0)
          macro=float(report["macro avg"]["f1-score"]); minrec=min(float(report[c]["recall"]) for c in classes)

          (OUT/"labels.txt").write_text("\n".join(classes)+"\n")
          conv=tf.lite.TFLiteConverter.from_keras_model(model); conv.optimizations=[tf.lite.Optimize.DEFAULT]; conv.target_spec.supported_types=[tf.float16]
          tflite=conv.convert(); (OUT/"pothigai_waste_classifier_fp16.tflite").write_bytes(tflite)

          manifest={"model":"Pothigai Green Broad Waste Classifier V1","labels":classes,"test_macro_f1":macro,"minimum_class_recall":minrec,"deployment_ready":bool(macro>=.85 and minrec>=.70),"warning":"Broad visual model only; not PET/HDPE/LDPE/PP chemistry."}
          (OUT/"model_manifest.json").write_text(json.dumps(manifest,indent=2))
          (OUT/"classification_report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload trained model and reports
        uses: actions/upload-artifact@v4
        with:
          name: pothigai-ai-broad-model-v1
          path: |
            pothigai_ai_model/pothigai_waste_classifier_fp16.tflite
            pothigai_ai_model/labels.txt
            pothigai_ai_model/model_manifest.json
            pothigai_ai_model/classification_report.json
            training_data/dataset_manifest.json
          if-no-files-found: error
          retention-days: 30