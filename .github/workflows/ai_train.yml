name: Train Pothigai AI Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Pothigai Green
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow-cpu==2.17.1" "numpy==1.26.4" "pillow==10.4.0" "scikit-learn==1.5.2" "requests==2.32.3"

      - name: Download official TACO dataset
        run: |
          git clone --depth 1 https://github.com/pedropro/TACO.git taco

          python - <<'PY'
          import json
          import time
          from io import BytesIO
          from pathlib import Path

          import requests
          from PIL import Image, ImageOps

          root = Path("taco").resolve()
          annotations = root / "data" / "annotations.json"
          data = json.loads(annotations.read_text(encoding="utf-8"))

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 PothigaiGreenTraining/1.0"
          })

          downloaded = 0
          skipped = 0

          for index, item in enumerate(data["images"], start=1):
              destination = root / "data" / item["file_name"]

              if destination.exists() and destination.stat().st_size > 0:
                  downloaded += 1
                  continue

              destination.parent.mkdir(parents=True, exist_ok=True)

              urls = [
                  item.get("flickr_url"),
                  item.get("flickr_640_url"),
              ]
              urls = [u for u in urls if u]

              saved = False
              last_error = None

              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(url, timeout=30)
                          response.raise_for_status()

                          if len(response.content) < 128:
                              raise ValueError(
                                  f"Response too small: {len(response.content)} bytes"
                              )

                          with Image.open(BytesIO(response.content)) as image:
                              image = ImageOps.exif_transpose(image).convert("RGB")
                              image.load()
                              image.save(destination, "JPEG", quality=95)

                          saved = True
                          downloaded += 1
                          break

                      except Exception as exc:
                          last_error = exc
                          time.sleep(1.5 * attempt)

                  if saved:
                      break

              if not saved:
                  skipped += 1
                  print(
                      f"WARNING: skipped {item.get('file_name')} "
                      f"after retries: {last_error}"
                  )

              if index % 100 == 0:
                  print(
                      f"Progress {index}/{len(data['images'])}: "
                      f"downloaded={downloaded}, skipped={skipped}"
                  )

          print(
              f"TACO download finished: downloaded={downloaded}, "
              f"skipped={skipped}, total={len(data['images'])}"
          )

          if downloaded < 500:
              raise SystemExit(
                  "Too few TACO images downloaded for reliable training."
              )
          PY

      - name: Prepare broad waste dataset
        run: |
          python - <<'PY'
          import json, hashlib, math
          from pathlib import Path
          from collections import Counter, defaultdict
          from PIL import Image, ImageOps

          ROOT = Path("taco").resolve()
          OUT = Path("training_data").resolve()
          ANN = ROOT / "data" / "annotations.json"

          CLASS_MAP = {
              "plastic_bottle": {"clear plastic bottle", "other plastic bottle"},
              "plastic_container": {
                  "disposable plastic cup", "other plastic cup",
                  "other plastic container", "tupperware", "spread tub",
                  "squeezable tube", "plastic lid"
              },
              "plastic_film": {
                  "plastic film", "single-use carrier bag", "garbage bag",
                  "other plastic wrapper", "crisp packet",
                  "polypropylene bag", "six pack rings"
              },
              "paper": {
                  "normal paper", "magazine paper", "wrapping paper",
                  "paper bag", "paper cup", "paper straw", "tissues"
              },
              "cardboard": {
                  "corrugated carton", "drink carton", "meal carton",
                  "other carton", "pizza box", "toilet tube", "egg carton"
              },
              "metal": {
                  "drink can", "food can", "aerosol", "aluminium foil",
                  "metal lid", "metal bottle cap", "scrap metal", "pop tab"
              },
              "glass": {
                  "glass bottle", "glass cup", "glass jar", "broken glass"
              }
          }

          def norm(value):
              return " ".join(
                  str(value).strip().lower().replace("_", " ").split()
              )

          reverse = {
              norm(source): target
              for target, names in CLASS_MAP.items()
              for source in names
          }

          def split_for(image_id):
              digest = hashlib.sha256(f"42:{image_id}".encode()).digest()
              x = int.from_bytes(digest[:8], "big") / 2**64
              if x < 0.80:
                  return "train"
              if x < 0.90:
                  return "val"
              return "test"

          def safe_crop(image, bbox):
              if not bbox or len(bbox) != 4:
                  return None

              x, y, w, h = [float(v) for v in bbox]

              if w < 28 or h < 28:
                  return None

              pad_x = w * 0.10
              pad_y = h * 0.10

              left = max(0, math.floor(x - pad_x))
              top = max(0, math.floor(y - pad_y))
              right = min(image.width, math.ceil(x + w + pad_x))
              bottom = min(image.height, math.ceil(y + h + pad_y))

              if right <= left or bottom <= top:
                  return None

              return image.crop((left, top, right, bottom)).convert("RGB")

          data = json.loads(ANN.read_text(encoding="utf-8"))

          images = {
              int(item["id"]): item
              for item in data["images"]
          }

          categories = {
              int(item["id"]): norm(item["name"])
              for item in data["categories"]
          }

          by_image = defaultdict(list)

          for annotation in data["annotations"]:
              by_image[int(annotation["image_id"])].append(annotation)

          counts = Counter()

          for image_id, annotations in by_image.items():
              metadata = images.get(image_id)

              if not metadata:
                  continue

              path = ROOT / "data" / metadata["file_name"]

              if not path.exists():
                  continue

              try:
                  with Image.open(path) as source:
                      source = ImageOps.exif_transpose(source).convert("RGB")

                      for index, annotation in enumerate(annotations):
                          category_name = categories.get(
                              int(annotation["category_id"]),
                              ""
                          )

                          target = reverse.get(category_name)

                          if not target:
                              continue

                          crop = safe_crop(
                              source,
                              annotation.get("bbox")
                          )

                          if crop is None:
                              continue

                          split = split_for(image_id)
                          folder = OUT / split / target
                          folder.mkdir(parents=True, exist_ok=True)

                          crop.save(
                              folder / f"taco_{image_id}_{index}.jpg",
                              "JPEG",
                              quality=92
                          )

                          counts[(split, target)] += 1

              except Exception as exc:
                  print("WARNING:", path, exc)

          for key, value in sorted(counts.items()):
              print(key, value)

          eligible = {
              class_name
              for (split, class_name), count in counts.items()
              if split == "train" and count >= 20
          }

          if len(eligible) < 3:
              raise SystemExit(
                  "Too few mapped waste classes for training."
              )

          manifest = {
              "source": "TACO",
              "source_repo": "https://github.com/pedropro/TACO",
              "split": "80/10/10 by original image hash",
              "counts": {
                  f"{split}/{class_name}": count
                  for (split, class_name), count in sorted(counts.items())
              },
              "note": (
                  "Broad visual waste model only. "
                  "Not a PET/HDPE/LDPE/PP chemistry classifier."
              )
          }

          OUT.mkdir(exist_ok=True)

          (OUT / "dataset_manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Train and validate MobileNetV3 model
        run: |
          python - <<'PY'
          import json
          import random
          from pathlib import Path

          import numpy as np
          import tensorflow as tf
          from sklearn.metrics import classification_report
          from sklearn.utils.class_weight import compute_class_weight

          ROOT = Path("training_data")
          OUT = Path("pothigai_ai_model")
          OUT.mkdir(exist_ok=True)

          IMAGE_SIZE = 224
          BATCH_SIZE = 32
          SEED = 42

          random.seed(SEED)
          np.random.seed(SEED)
          tf.random.set_seed(SEED)

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          def total_images(class_name):
              return sum(
                  1
                  for split in ("train", "val", "test")
                  for path in (ROOT / split / class_name).rglob("*")
                  if path.is_file() and path.suffix.lower() in extensions
              )

          classes = sorted(
              directory.name
              for directory in (ROOT / "train").iterdir()
              if directory.is_dir()
              and total_images(directory.name) >= 50
          )

          if len(classes) < 3:
              raise SystemExit(
                  "Need at least 3 sufficiently populated classes."
              )

          print("Training classes:", classes)

          def dataset(split, shuffle):
              return tf.keras.utils.image_dataset_from_directory(
                  ROOT / split,
                  labels="inferred",
                  label_mode="int",
                  class_names=classes,
                  image_size=(IMAGE_SIZE, IMAGE_SIZE),
                  batch_size=BATCH_SIZE,
                  shuffle=shuffle,
                  seed=SEED if shuffle else None
              ).prefetch(tf.data.AUTOTUNE)

          train = dataset("train", True)
          val = dataset("val", False)
          test = dataset("test", False)

          train_labels = np.concatenate(
              [labels.numpy() for _, labels in train]
          )

          weights = compute_class_weight(
              class_weight="balanced",
              classes=np.arange(len(classes)),
              y=train_labels
          )

          class_weights = {
              index: float(weight)
              for index, weight in enumerate(weights)
          }

          augmentation = tf.keras.Sequential([
              tf.keras.layers.RandomFlip("horizontal"),
              tf.keras.layers.RandomRotation(0.08),
              tf.keras.layers.RandomZoom(0.12),
              tf.keras.layers.RandomContrast(0.15)
          ])

          base = tf.keras.applications.MobileNetV3Small(
              input_shape=(IMAGE_SIZE, IMAGE_SIZE, 3),
              include_top=False,
              weights="imagenet",
              include_preprocessing=True
          )

          base.trainable = False

          inputs = tf.keras.Input(
              shape=(IMAGE_SIZE, IMAGE_SIZE, 3)
          )

          x = augmentation(inputs)
          x = base(x, training=False)
          x = tf.keras.layers.GlobalAveragePooling2D()(x)
          x = tf.keras.layers.Dropout(0.25)(x)

          outputs = tf.keras.layers.Dense(
              len(classes),
              activation="softmax"
          )(x)

          model = tf.keras.Model(inputs, outputs)

          callbacks = [
              tf.keras.callbacks.EarlyStopping(
                  monitor="val_loss",
                  patience=3,
                  restore_best_weights=True
              ),
              tf.keras.callbacks.ModelCheckpoint(
                  OUT / "best.keras",
                  monitor="val_loss",
                  save_best_only=True
              )
          ]

          model.compile(
              optimizer=tf.keras.optimizers.Adam(1e-3),
              loss="sparse_categorical_crossentropy",
              metrics=["accuracy"]
          )

          model.fit(
              train,
              validation_data=val,
              epochs=12,
              class_weight=class_weights,
              callbacks=callbacks,
              verbose=2
          )

          model = tf.keras.models.load_model(
              OUT / "best.keras"
          )

          y_true = []
          y_pred = []

          for images, labels in test:
              probabilities = model.predict(images, verbose=0)
              y_true.extend(labels.numpy().tolist())
              y_pred.extend(
                  np.argmax(probabilities, axis=1).tolist()
              )

          report = classification_report(
              y_true,
              y_pred,
              labels=list(range(len(classes))),
              target_names=classes,
              output_dict=True,
              zero_division=0
          )

          macro_f1 = float(
              report["macro avg"]["f1-score"]
          )

          minimum_recall = min(
              float(report[class_name]["recall"])
              for class_name in classes
          )

          (OUT / "labels.txt").write_text(
              "\n".join(classes) + "\n",
              encoding="utf-8"
          )

          converter = tf.lite.TFLiteConverter.from_keras_model(model)
          converter.optimizations = [tf.lite.Optimize.DEFAULT]
          converter.target_spec.supported_types = [tf.float16]

          tflite_model = converter.convert()

          (
              OUT / "pothigai_waste_classifier_fp16.tflite"
          ).write_bytes(tflite_model)

          deployment_ready = (
              macro_f1 >= 0.85
              and minimum_recall >= 0.70
          )

          manifest = {
              "model": "Pothigai Green Broad Waste Classifier V1",
              "labels": classes,
              "test_macro_f1": macro_f1,
              "minimum_class_recall": minimum_recall,
              "deployment_ready": bool(deployment_ready),
              "quality_gate": {
                  "macro_f1": 0.85,
                  "minimum_class_recall": 0.70
              },
              "warning": (
                  "Broad visual waste classifier only. "
                  "Do not use alone for PET/HDPE/LDPE/PP chemistry."
              )
          }

          (OUT / "model_manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )

          (OUT / "classification_report.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload trained model and reports
        uses: actions/upload-artifact@v4
        with:
          name: pothigai-ai-broad-model-v1
          path: |
            pothigai_ai_model/pothigai_waste_classifier_fp16.tflite
            pothigai_ai_model/labels.txt
            pothigai_ai_model/model_manifest.json
            pothigai_ai_model/classification_report.json
            training_data/dataset_manifest.json
          if-no-files-found: error
          retention-days: 30